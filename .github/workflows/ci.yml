name: TECHCORP Security CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Moindre privilège : le GITHUB_TOKEN ne peut que LIRE le dépôt (toutes les autres permissions = none).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Outils de scan exécutés depuis des images à version fixe (pas de "latest").
  # Versions publiées depuis plus de 14 jours au 22/10/2026.
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1
  TRIVY_IMAGE: aquasec/trivy:0.75.0

jobs:
  tests:
    name: Tests Pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions épinglées par SHA de commit (un tag peut être déplacé, un SHA non)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            app/requirements.txt
            requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q --junitxml=pytest-report.xml
      - name: Tests des règles d'alerte Prometheus (promtool)
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/monitoring:/m:ro" prom/prometheus:v3.2.1 \
            test rules /m/tests/alerts_test.yml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: pytest-report
          path: pytest-report.xml

  secrets:
    name: Secrets (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0              # tout l'historique : un secret supprimé reste dans Git
          persist-credentials: false
      - name: Gitleaks — bloquant si un secret est détecté
        run: |
          docker run --rm -v "$PWD:/repo" "$GITLEAKS_IMAGE" git /repo \
            --config /repo/.gitleaks.toml --redact --verbose --exit-code 1 \
            --report-format json --report-path /repo/gitleaks-report.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: ignore

  dependencies:
    name: Dépendances (Trivy fs)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Trivy fs — HIGH/CRITICAL corrigeables = bloquant
        run: |
          docker run --rm -v "$PWD:/src" "$TRIVY_IMAGE" fs \
            --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --ignorefile /src/.trivyignore --exit-code 1 /src
      - name: Trivy config — Dockerfile / Compose (informatif)
        run: |
          docker run --rm -v "$PWD:/src" "$TRIVY_IMAGE" config \
            --severity HIGH,CRITICAL --exit-code 0 /src

  image:
    name: Image Docker (build + Trivy image)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [tests]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Docker build
        run: docker build -t techcorp-api:ci .
      - name: Export de l'image (le scanner n'a pas accès au socket Docker)
        run: docker save techcorp-api:ci -o image.tar
      - name: Trivy image — OS + paquets Python, y compris transitifs
        run: |
          docker run --rm -v "$PWD:/src" "$TRIVY_IMAGE" image \
            --input /src/image.tar --severity HIGH,CRITICAL --ignore-unfixed \
            --ignorefile /src/.trivyignore --exit-code 1

  quality-gate:
    name: Quality gate
    runs-on: ubuntu-latest
    if: always()
    needs: [tests, secrets, dependencies, image]
    steps:
      - name: Décision (politique docs/quality-gate.md)
        run: |
          echo "tests=${{ needs.tests.result }} secrets=${{ needs.secrets.result }} deps=${{ needs.dependencies.result }} image=${{ needs.image.result }}"
          for r in "${{ needs.tests.result }}" "${{ needs.secrets.result }}" "${{ needs.dependencies.result }}" "${{ needs.image.result }}"; do
            if [ "$r" != "success" ]; then echo "::error::Quality gate ROUGE : fusion bloquée"; exit 1; fi
          done
          echo "Quality gate VERT"
